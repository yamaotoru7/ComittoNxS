plugins {
    id 'com.android.application'
}

def applicationName = "ComittoNxX"
def versionMajor = 2
def versionMinor = 4
def versionPatch = 10
def appVersion = "${versionMajor}.${versionMinor}.${versionPatch}"

if (file('../signingConfigs/release.gradle').exists()) {
    apply from: '../signingConfigs/release.gradle', to: android
}

android {
    namespace = "jp.dip.muracoro.comittonx"
    compileSdk 35

    defaultConfig {
        applicationId "jp.dip.muracoro.comittonx"
        targetSdk 35
        minSdk 21

        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName appVersion

        buildConfigField("long", "BUILD_DATE", System.currentTimeMillis().toString())
        resValue("string", "application_id", "jp.dip.muracoro.comittonx")

        externalNativeBuild {
            cmake {
                // Remove empty flags and arguments that might cause issues with newer AGP versions
                // cppFlags += ''
                // arguments ""
            }
        }
    }

    buildTypes {
        release {
            ndk {
                abiFilters "arm64-v8a"
            }
            resValue("string", "app_name", applicationName)
            resValue("string", "app_launch_name", applicationName)
            buildConfigField("int", "icon", "jp.dip.muracoro.comittonx.R.drawable.comittonxx")
            manifestPlaceholders = [icon: "@drawable/comittonxx"]
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            ndk {
                abiFilters "arm64-v8a"
            }
            applicationIdSuffix ".debug"
            resValue("string", "app_name", "${applicationName}[debug]")
            resValue("string", "app_launch_name", "${applicationName}[debug]")
            resValue("string", "application_id", "jp.dip.muracoro.comittonx.debug")
            buildConfigField("int", "icon", "jp.dip.muracoro.comittonx.R.drawable.comittonxx_debug")
            manifestPlaceholders = [icon: "@drawable/comittonxx_debug"]
            debuggable = true
            minifyEnabled = false
        }
    }


    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    lint {
        abortOnError = false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def bType = variant.buildType
            if (bType == "release") {
                output.outputFileName.set("${applicationName}-${appVersion}.apk")
            } else {
                output.outputFileName.set("${applicationName}[${bType}]-${appVersion}.apk")
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'commons-io:commons-io:2.18.0'

    // SMB接続用ライブラリjcifs
    implementation 'org.codelibs:jcifs:2.1.39'

    // 文字コード判定用ライブラリ
    implementation 'com.github.albfernandez:juniversalchardet:2.0.4'
}

plugins {
    id 'com.android.application'
}

def applicationName = "ComittoNxS"
def versionMajor = 3
def versionMinor = 0
def versionPatch = 1
def appVersion = "${versionMajor}.${versionMinor}.${versionPatch}"

// ビルド日時 (エポックミリ秒)
// SOURCE_DATE_EPOCH (秒) があればそれを、なければ最終コミットの日時を使う. どちらも取れなければ 0
def buildDateMillis() {
    def epoch = System.getenv("SOURCE_DATE_EPOCH")
    if (epoch?.trim()) {
        return Long.parseLong(epoch.trim()) * 1000L
    }
    try {
        def out = providers.exec {
            commandLine 'git', 'log', '-1', '--format=%ct'
            workingDir = rootDir
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (out.isLong()) {
            return Long.parseLong(out) * 1000L
        }
    } catch (Exception e) {
        logger.warn("git からビルド日時を取得できません: ${e.message}")
    }
    return 0L
}

if (file('../signingConfigs/release.gradle').exists()) {
    apply from: '../signingConfigs/release.gradle', to: android
}

android {
    namespace = "jp.dip.muracoro.comittonx"
    compileSdk 35

    defaultConfig {
        applicationId "jp.dip.muracoro.comittonx"
        targetSdk 35
        minSdk 21

        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName appVersion

        // ビルドのたびに値が変わるとビルドキャッシュが効かないため、最終コミットの日時を使う
        buildConfigField("long", "BUILD_DATE", "${buildDateMillis()}L")
        resValue("string", "application_id", "jp.dip.muracoro.comittonx")

        externalNativeBuild {
            cmake {
                // Remove empty flags and arguments that might cause issues with newer AGP versions
                // cppFlags += ''
                // arguments ""
            }
        }
    }

    buildTypes {
        release {
            ndk {
                abiFilters "arm64-v8a"
            }
            resValue("string", "app_name", applicationName)
            resValue("string", "app_launch_name", applicationName)
            buildConfigField("int", "icon", "jp.dip.muracoro.comittonx.R.drawable.comittonxx")
            manifestPlaceholders = [icon: "@drawable/comittonxx"]
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            ndk {
                abiFilters "arm64-v8a"
            }
            applicationIdSuffix ".debug"
            resValue("string", "app_name", "${applicationName}[debug]")
            resValue("string", "app_launch_name", "${applicationName}[debug]")
            resValue("string", "application_id", "jp.dip.muracoro.comittonx.debug")
            buildConfigField("int", "icon", "jp.dip.muracoro.comittonx.R.drawable.comittonxx_debug")
            manifestPlaceholders = [icon: "@drawable/comittonxx_debug"]
            debuggable = true
            minifyEnabled = false
        }
    }


    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    testOptions {
        // Android API の呼び出しを黙って既定値にすると誤りに気づけないので、呼ばれたら失敗させる
        unitTests.returnDefaultValues = false
    }

    lint {
        // 既存の指摘は lint-baseline.xml に記録し、新しく増えたエラーだけでビルドを失敗させる
        // 既存の指摘を直したら ./gradlew :app:updateLintBaseline で更新する
        baseline = file("lint-baseline.xml")
        abortOnError = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def bType = variant.buildType
            if (bType == "release") {
                output.outputFileName.set("${applicationName}-${appVersion}.apk")
            } else {
                output.outputFileName.set("${applicationName}[${bType}]-${appVersion}.apk")
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    implementation 'com.google.android.material:material:1.13.0'

    // SMB接続用ライブラリjcifs
    implementation 'org.codelibs:jcifs:2.1.40'

    // 文字コード判定用ライブラリ
    implementation 'com.github.albfernandez:juniversalchardet:2.5.0'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}
